<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        .container{
            border: 2px solid black;
            height: 50vh;
            width: 70vw;
            background-color: white;
            position: relative;
        }
        body{
            background-color: antiquewhite;
            padding: 44px;
        }
        .container .boll{
            height: 75px;
            width: 75px;
            border: 2px solid black;
            margin: 5px;
            border-radius: 88px;
            position: absolute;
            bottom: 0;
            overflow: hidden;
            animation: bollX 4s linear infinite alternate,
            bollY 1s ease-out infinite alternate;
        }
        .container .boll img{
            object-fit: cover;
            height: 100%;
            width: 100%;
        }
        .container .ii{
            object-fit: cover;
            width: 100%;
            height: 100%;
        }
        @keyframes bollX {
            from{
                left:0%;
            }
            0%{
                transform: rotate(3deg);
            }
            7%{
                transform: rotate(7deg);
            }
            11%{
                transform: rotate(11deg);
            }
            17%{
                transform: rotate(17deg);
            }
            20%{
                transform: rotate(20deg);
            }
            27%{
                transform: rotate(27deg);
            }
            35%{
                transform: rotate(35deg);
            }
            39%{
                transform: rotate(39deg);
            }
            44%{
                transform: rotate(44deg);
            }
            49%{
                transform: rotate(49deg);
            }
            53%{
                transform: rotate(53deg);
            }
            59%{
                transform: rotate(59deg);
            }
            63%{
                transform: rotate(63deg);
            }
            69%{
                transform: rotate(69deg);
            }
            74%{
                transform: rotate(74deg);
            }
            79%{
                transform: rotate(79deg);
            }
            84%{
                transform: rotate(84deg);
            }
            90%{
                transform: rotate(90deg);
            }
            94%{
                transform: rotate(94deg);
            }
            99%{
                transform: rotate(99deg);
            }
            to{
                left:90%;
            }
        }

        @keyframes bollY{
            from{
                bottom: 0%;
            }
            to{
                bottom: 70%;
            }
        }

    </style>
</head>
<body>
    <div class="container">
        <img class="ii" src="/G_data/playground.jpg" alt="">
        <div class="boll">
            <img height="44" src="/G_data/footboll.png" alt="">

        </div>
    </div>
</body>
</html>
