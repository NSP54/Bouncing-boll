<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            height: 55vh;
            width: 70vw;
            border: 2px solid black;
            background-color: white;
            position: relative;
            object-fit: cover;
        }
        .container img{
            object-fit: cover;
            height: 100%;
            width: 100%;
        }
        *{
            padding: 0;
             margin: 0;

        }
        body{
            background-color: bisque;
            padding: 50px;
        }
        .container .boll{
            height: 55px;
            width: 55px;
            border: 2px solid;
            border-radius: 52px;
            background-color: red;
            position: absolute;
            bottom: 0;
            animation: bollX 4s linear infinite alternate,
            bollY 1s ease-out infinite alternate;
            overflow: hidden;

        }
        .boll img{
            object-fit: cover;
            height: 100%;
            width: 100%;
        }

        @keyframes bollX{
            from{
                left:0%;
                background-color: green;
                rotate: calc(15deg);
            }
            0%{
                rotate: calc(3deg);
            }
            5%{
                rotate: calc(5deg);
            }
            15%{
                rotate: calc(15deg);
            }
            25%{
                rotate: calc(25deg);
            }
            55%{
                rotate: calc(55deg);
            }
            65%{
                rotate: calc(65deg);
            }
            75%{
                rotate: calc(75deg);
            }
            85%{
                rotate: calc(85deg);
            }
            95%{
                rotate: calc(95deg);
            }
            100%{
                rotate: calc(92deg);
            }

            to{
                left: 90%;
                rotate: calc(50deg);
            }
        }
        @keyframes bollY{
            from{
                bottom:0%;
            }
            to{
                bottom:60%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="/G_data/playground.jpg" alt="">
        <div class="boll">
            <img src="/G_data/foot.png" alt="">
        </div>
    </div>
    
</body>
</html>
